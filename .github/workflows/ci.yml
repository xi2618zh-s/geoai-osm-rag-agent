name: offline-ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install osmium CLI
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app_min.py src tests benchmarks scripts
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Audit reproducibility contract
        run: python scripts/check_reproducibility.py --ci
